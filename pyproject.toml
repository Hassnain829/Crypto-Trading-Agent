[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeagent"
version = "0.1.0"
description = "Self-improving crypto scalping agent: TradingView signals, shadow trading first, live on Binance later."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10",
    "ccxt>=4.5,<5",
    "numpy>=2.0",
    "pandas>=2.2",
    "psutil>=6",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tradeagent = "tradeagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not network'"
markers = ["network: needs internet access (run with: pytest -m network)"]
