# Crypt-AI-Trading settings.
# Secrets (API keys) never go here; they live in .env (see .env.example).
# All times are UTC.

exchange:
  # Trading venue: its prices fill the demo trades, and from Phase 6 it takes the live orders.
  # binance-usdm | coinbase-us | kraken-futures | coinbase-intl | bitget | mexc  (see src/tradeagent/venues.py)
  # Signals always come from the TradingView charts below. Changing the venue re-downloads market data.
  venue: binance-usdm
  symbols:                       # agent name -> TradingView signal chart and the market on each venue
    XRP:
      tradingview: "BINANCE:XRPUSDT.P"
      markets: {binance-usdm: "XRP/USDT:USDT", coinbase-us: "XPP-20DEC30-CDE", kraken-futures: "PF_XRPUSD",
                coinbase-intl: "XRP-PERP", bitget: "XRP/USDT:USDT", mexc: "XRP/USDT:USDT"}
    ETH:                         # v3.1 (2026-10-04): replaced LINK, which lost money with these rules
      tradingview: "BINANCE:ETHUSDT.P"
      markets: {binance-usdm: "ETH/USDT:USDT", coinbase-us: "ETP-20DEC30-CDE", kraken-futures: "PF_ETHUSD",
                coinbase-intl: "ETH-PERP", bitget: "ETH/USDT:USDT", mexc: "ETH/USDT:USDT"}
    SOL:
      tradingview: "BINANCE:SOLUSDT.P"
      markets: {binance-usdm: "SOL/USDT:USDT", coinbase-us: "SLP-20DEC30-CDE", kraken-futures: "PF_SOLUSD",
                coinbase-intl: "SOL-PERP", bitget: "SOL/USDT:USDT", mexc: "SOL/USDT:USDT"}

timeframes:
  trade: ["5m", "15m"]           # signals and entries
  overview: ["1h", "4h"]         # higher-timeframe context

tradingview:
  cdp_host: 127.0.0.1
  cdp_port: 9222
  app_id: "TradingView.Desktop_n534cwy3pjxzj!TradingView.Desktop"
  launcher: scripts/launch_tradingview_debug.ps1
  catalog: config/indicators.yaml  # which indicator plots the agent reads
  signal_version: 1              # see docs/TRADINGVIEW-SETUP.md
  min_bars: 1500                 # history kept loaded on every chart (indicator warm-up)
  read_delay_s: 3                # read this many seconds after a candle closes
  prepare_timeout_s: 30          # max wait for a chart to become ready
  stuck_reload_after_s: 240      # reload a tab whose chart stays in "loading" this long
  draw_trades: true              # draw paper trades (entry, stop, target, result) on the AGENT charts
  restart_above_mb: 4000         # restart TradingView after a cycle when it uses more memory (it grows over days); null = never
  restart_min_gap_hours: 6
  timezone: system               # time axis of the AGENT charts and dashboard times: system (this PC's) or e.g. Asia/Karachi
  layouts:                       # saved layout name -> layout id (from the chart URL)
    AGENT-XRP: "K7xX5RYP"
    AGENT-ETH: "CztsiO1R"          # the former AGENT-LINK layout, now showing ETHUSDT.P
    AGENT-SOL: "NZPfFmj0"
    AGENT-HTF: "9yUw9zox"

market_data:                     # Binance candles used to track shadow trades (never for indicators)
  history_days: 120               # enough for the 15m charts' 10,000-bar TradingView history
  candle_timeframes: ["1m", "5m", "15m", "1h"]   # 1h: stops and setups on the 1h chart

shadow:
  setups: config/setups.yaml     # baseline rules and the variants tested beside it
  max_hold_hours: 72             # close a shadow trade that is still open after this long

costs:                           # Binance VIP0 USDT-M; check your own account
  maker_fee: 0.0002
  taker_fee: 0.0005
  slippage: 0.0002               # assumed per market fill

paper_account:                   # demo account: one decision per coin (the user, 2026-10-24)
  starting_balance: 150
  risk_per_trade: 0.02           # 2% of the balance
  risk_tier_a: 0.03              # 3% on quality-A trades (a 15m Trendline breakout confirmed them; research 2026-10-18)
  max_positions: 5               # at most 5 positions open together (2026-10-24)
  max_positions_per_coin: 2      # at most 2 on a coin, both the same direction
  allow_opposite: false          # a signal against a coin's open position is skipped (no hedges)
  first_position_always: true    # max_positions never blocks a coin's first position
  daily_loss_stop: null          # null = off; live: 0.10-0.12 of the day's starting balance
  max_open_risk: 0.12            # open positions together lose at most 12% at their stops; bigger trades are made smaller, not skipped (the user, 2026-10-19)
  leverage_cap: 10               # each position is sized down to the free margin at 10x
  symbols: [XRP, SOL, ETH]       # v3.1 (2026-10-04): the coins the demo trades

live_account:                    # limits for live trading (Phase 6); edit them in the dashboard before going live
  starting_balance: 150
  risk_per_trade: 0.02
  max_positions: 5               # 2026-10-24: the demo's rules, so the live preview judges the same trading
  max_positions_per_coin: 2
  allow_opposite: false
  first_position_always: true
  max_open_risk: 0.12
  daily_loss_stop: 0.10          # 10% of the day's starting balance
  leverage_cap: 10
  symbols: [XRP, SOL, ETH]       # coins traded live (v3.1)

learning:                        # how experiments are judged (Phase 5; editable in the dashboard)
  min_trades: 100                # closed trades of challenger and baseline in the same period
  min_edge_r: 0.05               # challenger expectancy must beat the baseline by this much
  max_drawdown_worse: 0.25       # its max drawdown may be at most 25% worse
  reconfirm_trades: 50           # the winner must stay ahead on this many fresh trades
  max_challengers: 15
  auto_promote: true             # a confirmed winner becomes the demo baseline (live always needs your approval)
  screen_on_history: true        # proposals first replay the history and must win in both halves

research:                        # daily Claude research run (Phase 5)
  enabled: true                  # the agent runs `claude -p /research` once a day (Pro login on this computer)
  daily_time_utc: "06:00"

alerts:                          # phone messages through the ntfy app (topic in .env: NTFY_TOPIC)
  enabled: true
  trades: true                   # a message for every demo trade opened, skipped and closed
  failed_cycles: 3               # alert after this many cycles in a row with failed TradingView reads
  clock_offset_ms: 1000          # alert when this computer's clock is off the exchange by more
  stale_minutes: 15              # the dashboard alerts when the agent has not finished a cycle this long
  status_hours: 4                # open positions (entry, SL, TP, price, P/L) every 4 h at 00/04/08.. UTC; write 'status' in the app any time
  repeat_hours: 6                # an unsolved problem is repeated at most this often

goal:                            # go-live gate (proposed; editable later in the dashboard)
  min_trades: 100                # the baseline's forward shadow trades (every signal); ~16-17 days at ~6 a day
  min_days: 14
  min_expectancy_r: 0.10
  min_edge_lower_r: 0.0           # and above this with 90% confidence (trades of one market move resampled together)
  min_profit_factor: 1.3
  max_drawdown: 0.15
  min_snapshot_coverage: 0.99
  count_from: "2026-08-01"       # 2026-10-24 (the user): v4's trades count from 1 Aug, replayed on the agent's own
                                 # TradingView data before the switch (tradeagent import-replay)

quality:                         # reasons that make a trade quality A (the demo risks risk_tier_a, 3%, on it)
  trendline: true                # a same-direction 15m Trendline breakout in the last 2 hours
  open_interest: true            # open interest up more than 1% in the 4 hours before
  chart_4h: true                 # 2026-10-24: a 4h chart-pattern breakout the trade's way in the last 2 closed 4h candles
  btc_move: 0.02                 # 2026-10-24: BTC moved 2%+ the trade's way over the last 12 hours

logging:
  level: INFO
  file: data/logs/agent.log
  max_bytes: 5000000
  backups: 5

journal:
  path: data/journal.db
