# Setup rules for the shadow engine.
# "baseline" is the current best rule set; the paper account trades it. History:
#   v0 (2026-10-02): the video's checklist - Q-Trend arrow confirmed by Klinger and the candle,
#                    stop at the 10-candle swing, target 1.5R, market entry.
#   v1 (2026-10-03): v0, but skip setups whose swing stop is closer than 1% (costs eat tight stops).
#   v2 (2026-10-03): stops of at least 1.5%, and limit-order entries (maker fee, no slippage).
#                    Positive in all four sub-periods of the ~100-day history; must hold on fresh data.
#   See docs/research/2026-10-03-strategy-review.md.
#   v3, v3.1 (2026-10-04): the v2 rules on XRP, SOL and ETH (the coins are chosen in settings.yaml).
#   v4 (2026-10-24, approved by the user): one decision per coin. Only 15m signals (5m signals lost every year), the
#                    limit entry waits up to 60 min for the first 5m candle against the trade, and signals against a
#                    2%+ BTC move over the last 12 h are skipped. With the account rules in settings.yaml: 4 years
#                    +1,089% (DD 60%) vs +807% for v3.1's rules; research/notes/2026-10-24-patterns-per-coin-plan.md.
# Every variant changes exactly ONE thing from the baseline.
# All of them run in parallel on the same signals in the exploration book. Changing a variant's rules
# gives it a new id automatically, and the agent picks up changes to this file in its next cycle.
#
# Learning loop (Phase 5): the variants below are tracked as experiments and judged automatically.
# Claude's proposals are stored in the journal, not here (see the Learning page). A promotion (automatic,
# or the Promote button on the Learning page) writes the change into this baseline, removes the
# challenger's line and adds a version line above; a backup goes to data/backups.
# Retired variants and why: research/lessons.md and research/results.tsv.

baseline:
  timeframes: ["15m"]
  trigger:
    indicator: qtrend        # qtrend | zerolag | atp_macd
    long: buy                # flag field (config/indicators.yaml) that starts a long setup
    short: sell
  confirmation:
    window: 3                # candles after the trigger candle in which confirmation may come (0 = trigger candle only)
    klinger: true            # Klinger histogram >= 0 for longs, < 0 for shorts
    candle_direction: true   # bullish candle for longs, bearish candle for shorts
  filters:
    vwap: false              # longs only at/above VWAP, shorts only at/below
    macd_trend: false        # longs only when the ATP MACD line > 0, shorts only when < 0
    htf: none                # none | 1h | 1h+4h (Zero Lag trend must agree) | against_4h (must disagree)
    min_stop_pct: 1.5        # skip setups whose swing stop is closer than this % of the entry
    zl_own: false            # the signal must agree with its own chart's Zero Lag trend
    session_utc: null        # [start, end): only entries whose UTC hour is inside
    btc_against_pct: 2.0     # skip signals against a BTC move of at least this % over the last btc_against_hours
    btc_against_hours: 12
  entry:
    mode: limit              # market (taker + slippage) | limit (maker; fills only if the first minute trades through)
    dip_5m_minutes: 60       # wait up to this long for the first 5m candle that closes against the trade, then enter
  stop:
    lookback: 10             # lowest low (long) / highest high (short) of the last N candles, confirming candle included
    anchor: trade            # trade | 1h: also beyond the last N closed 1h candles
    multiplier: 1.0          # stop distance x this (the target stays at take_profit_r of the swing)
  exit:
    mode: fixed              # fixed | hybrid | htf_rule (hybrid when 1h and 4h agree, otherwise fixed)
    take_profit_r: 1.5
    partial_r: 1.0           # hybrid: close part of the trade at this R
    partial_fraction: 0.5
    trail_lookback: 3        # hybrid: then trail behind the low/high of the last N closed candles
    breakeven_r: null        # stop to break-even once the price went this many R
    opposite_signal: false   # close when the opposite trigger appears on the same chart
    max_candles: null        # time stop: close at market after this many chart candles

variants:
  # The reference video_original (the video's rules: no minimum stop, market entry) was retired on 2026-10-18
  # after -0.225R a trade over 306 forward trades.

  # One change each. Retired 2026-10-04 (worse than the baseline on the history): min_stop_1pct,
  # min_stop_2pct, confirm_0, stop_1h_swing, trigger_strong.
  # filter_vwap was retired on 2026-10-20: +0.172R on 36 forward trades against the baseline's +0.346R, and the
  # Squeeze Momentum study replaced VWAP on the AGENT charts (TradingView Essential allows 5 studies a chart).
  # Retired with v4 on 2026-10-24: market_entry, session_13_21, session_07_21, htf_against_4h, tf_15m, trend15 (all
  # negative over 3 years with the agent's engine) and dip15 (now the baseline). The forward checks of v4's parts:
  news_filters:     {filters: {btc_shock_wait_minutes: 60, fear_greed_extremes: [20, 80]}}  # 4 years better, June 2026 worse
  no_dip:           {entry: {dip_5m_minutes: 0}}          # entering at once: what the 5m dip entry is worth
  no_btc_skip:      {filters: {btc_against_pct: 0}}       # what skipping signals against BTC's move is worth
